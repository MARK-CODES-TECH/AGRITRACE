<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2e7d32">
<title>AgriTrace+ | Offline</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f1f8e9;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1b3a1d;padding:20px}
.card{max-width:420px;width:100%;background:#fff;border-radius:16px;padding:32px 24px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.08)}
img{width:96px;height:96px;border-radius:20px}h1{font-size:1.4rem;margin:16px 0 8px}p{line-height:1.5;color:#445}
button{margin-top:16px;background:#2e7d32;color:#fff;border:0;border-radius:10px;padding:14px 24px;font-size:1rem;min-height:48px;width:100%}
.note{font-size:.85rem;margin-top:16px;color:#667}
</style></head><body>
<div class="card">
<img src="/icons/icon-192.png" alt="AgriTrace+">
<h1>You're offline</h1>
<p>AgriTrace+ needs an internet connection to load your farm data, messages, and records.</p>
<button onclick="location.reload()">Try Again</button>
<p class="note">Incident reports and service requests you submit offline are saved as drafts and sent automatically when you're back online.</p>
</div>
<script>addEventListener('online',()=>location.reload())</script>
</body></html>
